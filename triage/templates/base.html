<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Triage{% endblock %}</title>
<meta name="description" content="Every bug bounty report, reproduced or rejected before a human reads it.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8 12 3 3 5-6" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Triage
  </a>
  <nav>
    <a href="/">Inbox</a>
    <a href="/submit" class="btn btn-sm">Submit report</a>
  </nav>
</header>
<main>{% block main %}{% endblock %}</main>
<footer class="foot">
  Runs on <strong>Vultr Cloud Compute</strong> · agent calls on <strong>{{ inference_label()[0] }}</strong> ·
  every execution in a disposable sandbox · <a href="https://github.com/Abrar5510/triage">source</a>
</footer>
<script>
// One click starts one triage: lock the button and show progress while the server queues it.
document.addEventListener("submit", e => {
  const b = e.target.querySelector("button");
  if (!b) return;
  if (b.dataset.busy) return e.preventDefault();
  b.dataset.busy = "1"; b.classList.add("busy"); b.setAttribute("aria-busy", "true");
  const go = b.querySelector(".sample-go, .btn-label");
  if (go) go.textContent = go.classList.contains("btn-label") ? "Starting triage…" : "…";
});
// Back/forward cache restores pages as they were left: unlock buttons.
window.addEventListener("pageshow", () => document.querySelectorAll("button[data-busy]").forEach(b => {
  delete b.dataset.busy; b.classList.remove("busy"); b.removeAttribute("aria-busy");
}));
// Cmd/Ctrl+Enter submits from a textarea.
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.form) e.target.form.requestSubmit();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
