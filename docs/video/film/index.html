<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0b0d10"},
    {"id":"color-ok","type":"color","label":"Accent (reproduced)","default":"#3ddc97"},
    {"id":"color-danger","type":"color","label":"Danger (hostile)","default":"#ff5c6c"},
    {"id":"repo-url","type":"string","label":"Repo URL","default":"github.com/Abrar5510/triage"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/app.css" />
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/InterTight-var.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --color-ground: #0b0d10;
        --color-ok: #3ddc97;
        --color-danger: #ff5c6c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        color: #e7eaf0;
        font: 15px/1.55 "Inter Tight", sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* Shared film pieces used by several scenes. */
      .line {
        font-family: "Inter Tight", sans-serif;
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      .line .w {
        display: inline-block;
        white-space: pre;
      }
      .ui {
        zoom: 1.5;
      }
      .ui ol,
      .ui ul {
        list-style: none;
      }
      .ui .stepper li::before {
        top: 14px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="110"
      data-width="1920"
      data-height="1080"
