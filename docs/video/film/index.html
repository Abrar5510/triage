      }
      :root {
        --color-ground: #0b0d10;
        --color-ok: #3ddc97;
        --color-danger: #ff5c6c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        color: #e7eaf0;
        font: 15px/1.55 "Inter Tight", sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* Shared film pieces used by several scenes. */
      .line {
        font-family: "Inter Tight", sans-serif;
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      .line .w {
        display: inline-block;
        white-space: pre;
      }
      .ui {
        zoom: 1.5;
      }
      .ui ol,
      .ui ul {
        list-style: none;
      }
      .ui .stepper li::before {
        top: 14px;
      }
    </style>
