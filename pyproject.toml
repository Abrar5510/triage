[project]
name = "triage"
version = "1.0.0"
description = "Every bug bounty report, reproduced or rejected before a human reads it."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pip>=24",
]

[tool.setuptools]
packages = ["triage"]
